<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Roulette</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(ellipse at 50% 0%,#065f46 0%,#022c22 60%,#011a14 100%);color:#fff;font-family:system-ui,sans-serif;min-height:100dvh;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px;overflow-x:hidden}
h1{font-size:18px;font-weight:900;color:#ffd700;text-shadow:0 0 20px rgba(255,215,0,.5)}
canvas{border-radius:50%;box-shadow:0 0 40px rgba(0,0,0,.6),0 0 0 6px rgba(255,215,0,.4);display:block}
#ball-result{font-size:36px;font-weight:900;text-align:center;min-height:44px;line-height:44px}
.red{color:#ef4444}.black{color:#e2e8f0}.green{color:#22c55e}
/* Betting table */
#table{display:flex;flex-direction:column;gap:4px;width:100%;max-width:360px}
.bet-row{display:flex;gap:3px}
.bet-cell{flex:1;border-radius:6px;border:1px solid rgba(255,255,255,.2);padding:8px 4px;text-align:center;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;position:relative}
.bet-cell:hover{filter:brightness(1.3);transform:scale(1.05)}
.bet-cell.selected{outline:3px solid #ffd700;filter:brightness(1.3)}
.num-red{background:rgba(220,38,38,.4);color:#fca5a5}
.num-black{background:rgba(30,30,30,.8);color:#e2e8f0}
.num-green{background:rgba(22,163,74,.5);color:#86efac}
.outside{background:rgba(255,255,255,.08)}
.bet-chip{position:absolute;top:-6px;right:-4px;background:#ffd700;color:#000;border-radius:50%;width:18px;height:18px;font-size:10px;display:grid;place-items:center;font-weight:900;display:none}
#ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;width:100%}
input[type=number]{background:#022c22;border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:8px;padding:8px 12px;font-size:15px;font-weight:700;width:110px;text-align:center}
#spinBtn{border:none;border-radius:12px;padding:11px 32px;font-size:16px;font-weight:900;cursor:pointer;background:linear-gradient(175deg,#fbbf24,#d97706);color:#000;box-shadow:0 4px 18px rgba(251,191,36,.4);transition:filter .15s,transform .1s}
#spinBtn:active{transform:scale(.95)}
#spinBtn:disabled{opacity:.5;cursor:default}
#msg{font-size:13px;font-weight:700;text-align:center;min-height:20px;color:#ffd700}
#cred{font-size:12px;color:#4ade80;padding:3px 14px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);border-radius:20px}
</style>
</head>
<body>
<h1>🎰 ROULETTE</h1>
<canvas id="wheel" width="240" height="240"></canvas>
<div id="ball-result"></div>
<div id="msg">Click a bet below, then SPIN!</div>

<div id="table"></div>

<div id="ctrl">
  <input id="betIn" type="number" value="100" min="10" step="10" max="5000"/>
  <button id="spinBtn" onclick="spin()">SPIN</button>
</div>
<div id="cred">💳 <span id="credEl">5,000</span></div>

<script>
const NUMS=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
const RED_NUMS=new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
const numColor=n=>n===0?'green':RED_NUMS.has(n)?'red':'black';

let credits=5000,selectedBet=null,angle=0,spinning=false;
const upCred=()=>document.getElementById('credEl').textContent=credits.toLocaleString();

// Build table
function buildTable(){
  const t=document.getElementById('table');
  // Outside bets
  const outside=[
    [{label:'1-18',type:'low',mult:2},{label:'EVEN',type:'even',mult:2},{label:'🔴 RED',type:'red',mult:2},{label:'⚫ BLACK',type:'black',mult:2},{label:'ODD',type:'odd',mult:2},{label:'19-36',type:'high',mult:2}],
    [{label:'1st 12',type:'dozen1',mult:3},{label:'2nd 12',type:'dozen2',mult:3},{label:'3rd 12',type:'dozen3',mult:3}],
  ];
  outside.forEach(row=>{
    const div=document.createElement('div');div.className='bet-row';
    row.forEach(b=>{
      const cell=document.createElement('div');
      cell.className='bet-cell outside';cell.textContent=b.label;cell.title=`Pays ${b.mult}×`;
      cell.addEventListener('click',()=>{selectedBet=b;highlightBet(cell)});
      div.appendChild(cell);
    });
    t.appendChild(div);
  });
  // Numbers 1-36 in 3 columns
  const numDiv=document.createElement('div');numDiv.className='bet-row';numDiv.style.flexWrap='wrap';
  numDiv.style.gap='2px';
  const zeroCell=document.createElement('div');
  zeroCell.className='bet-cell num-green';zeroCell.textContent='0';zeroCell.title='Pays 36×';
  zeroCell.addEventListener('click',()=>{selectedBet={label:'0',type:'straight',num:0,mult:36};highlightBet(zeroCell)});
  numDiv.appendChild(zeroCell);
  for(let n=1;n<=36;n++){
    const cell=document.createElement('div');
    const c=numColor(n);
    cell.className=`bet-cell num-${c}`;cell.textContent=n;cell.title='Pays 36×';
    cell.style.minWidth='calc(100%/13 - 2px)';
    cell.addEventListener('click',()=>{selectedBet={label:n,type:'straight',num:n,mult:36};highlightBet(cell)});
    numDiv.appendChild(cell);
  }
  t.appendChild(numDiv);
}

let lastHighlighted=null;
function highlightBet(cell){
  if(lastHighlighted)lastHighlighted.classList.remove('selected');
  cell.classList.add('selected');lastHighlighted=cell;
  document.getElementById('msg').textContent=`Bet on: ${selectedBet.label} (pays ${selectedBet.mult}×)`;
}

// Draw wheel
const cv=document.getElementById('wheel'),ctx=cv.getContext('2d');
const cx=120,cy=120,R=115;

function drawWheel(a){
  ctx.clearRect(0,0,240,240);
  const slice=Math.PI*2/NUMS.length;
  NUMS.forEach((n,i)=>{
    const s=a+i*slice,e=s+slice;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,s,e);
    const c=numColor(n);
    ctx.fillStyle=c==='red'?'#991b1b':c==='black'?'#1e293b':'#166534';
    ctx.fill();ctx.strokeStyle='rgba(255,215,0,.4)';ctx.lineWidth=1;ctx.stroke();
    // Number label
    ctx.save();ctx.translate(cx,cy);ctx.rotate(s+slice/2);
    ctx.translate(R*0.78,0);ctx.rotate(Math.PI/2);
    ctx.fillStyle='#fff';ctx.font='bold 10px system-ui';ctx.textAlign='center';
    ctx.fillText(n,0,3);ctx.restore();
  });
  // Centre circle
  const g=ctx.createRadialGradient(cx,cy,5,cx,cy,24);
  g.addColorStop(0,'#ffd700');g.addColorStop(1,'#92400e');
  ctx.beginPath();ctx.arc(cx,cy,24,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
  ctx.fillStyle='#000';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('SPIN',cx,cy);
  // Ball indicator at top
  ctx.beginPath();ctx.arc(cx,cy-R+12,8,0,Math.PI*2);
  ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#ffd700';ctx.lineWidth=2;ctx.stroke();
}

drawWheel(0);

function checkWin(n,bet){
  const c=numColor(n);
  if(bet.type==='straight')return n===bet.num;
  if(bet.type==='red')return c==='red';
  if(bet.type==='black')return c==='black';
  if(bet.type==='even')return n>0&&n%2===0;
  if(bet.type==='odd')return n%2===1;
  if(bet.type==='low')return n>=1&&n<=18;
  if(bet.type==='high')return n>=19&&n<=36;
  if(bet.type==='dozen1')return n>=1&&n<=12;
  if(bet.type==='dozen2')return n>=13&&n<=24;
  if(bet.type==='dozen3')return n>=25&&n<=36;
  return false;
}

function spin(){
  if(spinning){return}
  if(!selectedBet){document.getElementById('msg').textContent='⚠️ Select a bet first!';return}
  const bet=parseInt(document.getElementById('betIn').value)||100;
  if(credits<bet){document.getElementById('msg').textContent='❌ Not enough credits!';return}
  credits-=bet;upCred();spinning=true;
  document.getElementById('spinBtn').disabled=true;
  document.getElementById('ball-result').textContent='';

  const resultIdx=Math.floor(Math.random()*NUMS.length);
  const resultNum=NUMS[resultIdx];
  const targetAngle=-resultIdx*(Math.PI*2/NUMS.length)+Math.PI*2*5+Math.random()*0.1;
  let start=null,dur=4000;
  const ease=t=>1-Math.pow(1-t,4);

  function anim(ts){
    if(!start)start=ts;
    const elapsed=ts-start,prog=Math.min(elapsed/dur,1);
    angle=targetAngle*ease(prog);
    drawWheel(angle);
    if(prog<1){requestAnimationFrame(anim);return}
    // Done
    spinning=false;
    document.getElementById('spinBtn').disabled=false;
    const c=numColor(resultNum);
    const resEl=document.getElementById('ball-result');
    resEl.textContent=`${resultNum}`;resEl.className=c;
    const won=checkWin(resultNum,selectedBet);
    if(won){
      const payout=Math.round(bet*selectedBet.mult);
      credits+=payout;upCred();
      document.getElementById('msg').textContent=`🏆 ${resultNum} ${c.toUpperCase()}! Won ${payout} credits (${selectedBet.mult}×)`;
    } else {
      document.getElementById('msg').textContent=`😔 ${resultNum} ${c.toUpperCase()}. Bet on ${selectedBet.label} — missed. Lost ${bet}.`;
    }
  }
  requestAnimationFrame(anim);
}

buildTable();upCred();
</script>
</body>
</html>
