<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Plinko</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(160deg,#0d0a2e 0%,#080520 100%);color:#fff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100dvh;padding:12px;gap:10px;overflow-x:hidden}
h1{font-size:18px;font-weight:900;color:#a78bfa;text-shadow:0 0 20px rgba(167,139,250,.5)}
canvas{border-radius:12px;border:1px solid rgba(255,255,255,.08);display:block;touch-action:none}
#slots{display:flex;width:100%;max-width:380px;gap:3px;margin-top:-2px}
.slot{flex:1;border-radius:6px;padding:4px 2px;text-align:center;font-size:10px;font-weight:800;transition:background .3s}
.slot.m0{background:#16a34a;color:#fff}
.slot.m1{background:#1d4ed8;color:#fff}
.slot.m2{background:#7c3aed;color:#fff}
.slot.m3{background:#b45309;color:#fff}
.slot.m4{background:#dc2626;color:#fff}
.slot.hit{filter:brightness(1.8);transform:scale(1.1)}
#ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
input[type=number]{background:#100e2e;border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:8px;padding:8px 12px;font-size:15px;font-weight:700;width:110px;text-align:center}
select{background:#100e2e;border:1px solid rgba(255,255,255,.15);color:#a78bfa;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer}
button{border:none;border-radius:10px;padding:10px 28px;font-size:15px;font-weight:900;cursor:pointer;background:linear-gradient(175deg,#7c3aed,#5b21b6);color:#fff;box-shadow:0 4px 16px rgba(124,58,237,.4);transition:filter .15s,transform .1s}
button:active{transform:scale(.95)}
#info{display:flex;gap:16px}
.st{text-align:center}.st label{display:block;font-size:10px;color:#888}.st b{font-size:18px;color:#a78bfa}
#msg{font-size:13px;font-weight:700;min-height:18px;color:#ffd700;text-align:center}
</style>
</head>
<body>
<h1>🎯 PLINKO</h1>
<div id="info">
  <div class="st"><label>Credits</label><b id="cred">5,000</b></div>
  <div class="st"><label>Risk</label><b id="riskLbl">Medium</b></div>
  <div class="st"><label>Last Win</label><b id="lastWin">—</b></div>
</div>
<canvas id="cv"></canvas>
<div id="slots"></div>
<div id="msg">Drop a ball and watch it fall!</div>
<div id="ctrl">
  <input id="betIn" type="number" value="100" min="10" max="5000" step="10"/>
  <select id="riskIn" onchange="setRisk(this.value)">
    <option value="low">Low Risk</option>
    <option value="med" selected>Medium</option>
    <option value="high">High Risk</option>
  </select>
  <button onclick="drop()">DROP BALL</button>
</div>
<div style="font-size:12px;color:#666">💳 <span id="cred2">5,000</span> credits</div>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const ROWS=12,W=Math.min(380,window.innerWidth-24),PEG_R=5,BALL_R=7;
cv.width=W;cv.height=W*1.05;

const RISKS={
  low: [1.5,1.2,1.1,1.0,0.5,0.3,0.5,1.0,1.1,1.2,1.5],
  med: [5,3,2,1.5,0.5,0.3,0.5,1.5,2,3,5],
  high:[100,10,5,2,0.5,0.2,0.5,2,5,10,100]
};
const COLORS={low:'#16a34a',med:'#7c3aed',high:'#dc2626'};
let risk='med',credits=5000,balls=[],animId=null,pegs=[];

const upCred=()=>{const v=credits.toLocaleString();document.getElementById('cred').textContent=v;document.getElementById('cred2').textContent=v};
const setRisk=r=>{risk=r;document.getElementById('riskLbl').textContent={low:'Low',med:'Medium',high:'High'}[r];buildSlots();drawPegs()};

function buildSlots(){
  const mults=RISKS[risk];
  const slots=document.getElementById('slots');
  slots.innerHTML=mults.map((m,i)=>`<div class="slot m${Math.min(i,mults.length-1-i)}">${m}×</div>`).join('');
  slots.style.width=W+'px';
}

function buildPegs(){
  pegs=[];
  const padX=30,padY=40,rowH=(cv.height-padY-60)/(ROWS-1);
  for(let r=0;r<ROWS;r++){
    const cols=r+2;
    const rowW=W-padX*2;
    const spacing=rowW/(cols-1);
    for(let c=0;c<cols;c++){
      pegs.push({x:padX+(c*spacing),y:padY+r*rowH});
    }
  }
}

function drawPegs(){
  ctx.fillStyle='#0d0a2e';ctx.fillRect(0,0,cv.width,cv.height);
  // Grid dots
  ctx.fillStyle=COLORS[risk];
  for(const p of pegs){
    ctx.beginPath();ctx.arc(p.x,p.y,PEG_R,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(p.x,p.y,PEG_R-1,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,.25)';ctx.fill();
    ctx.fillStyle=COLORS[risk];
  }
}

function drop(){
  const bet=parseInt(document.getElementById('betIn').value)||100;
  if(credits<bet){document.getElementById('msg').textContent='❌ Not enough credits!';return}
  credits-=bet;upCred();
  const ball={x:W/2+(Math.random()-.5)*4,y:10,vx:(Math.random()-.5)*1.5,vy:2,bet,trail:[],bouncing:true};
  balls.push(ball);
  if(!animId)animId=requestAnimationFrame(animate);
}

function animate(){
  ctx.fillStyle='rgba(13,10,46,.4)';ctx.fillRect(0,0,cv.width,cv.height);
  drawPegs();

  let anyActive=false;
  balls.forEach((ball,bi)=>{
    if(!ball.bouncing)return;
    anyActive=true;
    // Physics
    ball.vy+=0.35;
    ball.vx*=0.99;
    ball.x+=ball.vx;ball.y+=ball.vy;

    // Clamp to canvas
    if(ball.x<BALL_R){ball.x=BALL_R;ball.vx=Math.abs(ball.vx)}
    if(ball.x>W-BALL_R){ball.x=W-BALL_R;ball.vx=-Math.abs(ball.vx)}

    // Peg collision
    for(const peg of pegs){
      const dx=ball.x-peg.x,dy=ball.y-peg.y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<BALL_R+PEG_R+1){
        const nx=dx/dist,ny=dy/dist;
        const dot=ball.vx*nx+ball.vy*ny;
        ball.vx-=2*dot*nx;ball.vy=Math.abs(ball.vy-2*dot*ny*0.7);
        ball.vx+=(Math.random()-.5)*1.5;
        const overlap=BALL_R+PEG_R+1-dist;
        ball.x+=nx*overlap;ball.y+=ny*overlap;
        ball.vy=Math.max(ball.vy,1.5);
        break;
      }
    }

    // Landed?
    if(ball.y>cv.height-30){
      ball.bouncing=false;
      // Determine slot
      const mults=RISKS[risk];
      const slotW=W/mults.length;
      const idx=Math.min(mults.length-1,Math.max(0,Math.floor(ball.x/slotW)));
      const mult=mults[idx];
      const win=Math.round(ball.bet*mult);
      credits+=win;upCred();
      const profit=win-ball.bet;
      document.getElementById('msg').textContent=`${mult>1?'🏆':'😔'} ${mult}× → ${win} credits (${profit>=0?'+':''}${profit})`;
      document.getElementById('lastWin').textContent=win;
      // Flash slot
      const slotEls=document.querySelectorAll('.slot');
      if(slotEls[idx]){slotEls[idx].classList.add('hit');setTimeout(()=>slotEls[idx].classList.remove('hit'),500)}
    }

    // Trail
    ball.trail.push({x:ball.x,y:ball.y});
    if(ball.trail.length>8)ball.trail.shift();

    // Draw trail
    ball.trail.forEach((p,i)=>{
      ctx.beginPath();ctx.arc(p.x,p.y,BALL_R*(i/ball.trail.length),0,Math.PI*2);
      ctx.fillStyle=`rgba(251,191,36,${i/ball.trail.length*.5})`;ctx.fill();
    });

    // Draw ball
    const g=ctx.createRadialGradient(ball.x-2,ball.y-2,1,ball.x,ball.y,BALL_R);
    g.addColorStop(0,'#fff');g.addColorStop(.4,'#fbbf24');g.addColorStop(1,'#b45309');
    ctx.beginPath();ctx.arc(ball.x,ball.y,BALL_R,0,Math.PI*2);
    ctx.fillStyle=g;ctx.fill();
  });

  balls=balls.filter(b=>b.bouncing||b.y<cv.height+20);
  if(anyActive||balls.length)animId=requestAnimationFrame(animate);
  else animId=null;
}

buildPegs();buildSlots();drawPegs();upCred();
</script>
</body>
</html>
